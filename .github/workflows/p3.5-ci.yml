name: P3.5 Production Hardening CI

on:
  push:
    branches:
      - feat/p3.5-production-hardening
  pull_request:
    branches:
      - feat/p3-production-observability
      - main

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      LLM_MOCK_MODE: "true"
      TOOL_MOCK_MODE: "true"
      EMBEDDING_PROVIDER: hash
      RAG_VECTOR_BACKEND: memory
      RERANK_MODE: local
      SESSION_BACKEND: memory
      PERSISTENCE_ENABLED: "false"
      API_AUTH_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      OTEL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.build_knowledge
      - run: python -m pytest -q --ignore=tests/test_qdrant_integration.py --ignore=tests/test_p3_integration.py --ignore=tests/test_p3_5_integration.py
      - run: python -m scripts.eval_rag --fail-on-threshold
      - run: python -m scripts.eval_agent --fail-on-threshold

  migrated-backend-integration:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://guilin:guilin@localhost:5432/guilin_ai
      PERSISTENCE_ENABLED: "true"
      DATABASE_AUTO_CREATE: "false"
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: guilin_ai
          POSTGRES_USER: guilin
          POSTGRES_PASSWORD: guilin
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U guilin -d guilin_ai" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - name: Migrated backend integration
        env:
          P3_5_INTEGRATION: "1"
        run: python -m pytest -q tests/test_p3_5_integration.py

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f deploy/observability/docker-compose.observability.yml config >/dev/null
      - run: python -m json.tool deploy/observability/grafana/dashboards/guilin-ai-overview.json >/dev/null
