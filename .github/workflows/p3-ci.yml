name: P3 Production Backend CI

on:
  push:
    branches:
      - feat/p3-production-observability
  pull_request:
    branches:
      - feat/p2.5-provider-reliability
      - main

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      LLM_MOCK_MODE: "true"
      RAG_ENABLED: "true"
      RAG_KNOWLEDGE_PATH: data/knowledge/verified
      EMBEDDING_PROVIDER: "hash"
      RAG_VECTOR_BACKEND: "memory"
      RERANK_MODE: "local"
      AGENT_ENABLED: "true"
      TOOL_MOCK_MODE: "true"
      SESSION_BACKEND: "memory"
      PERSISTENCE_ENABLED: "false"
      AGENT_EVAL_INTENT_ACCURACY_MIN: "0.90"
      AGENT_EVAL_TOOL_SELECTION_ACCURACY_MIN: "0.90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate knowledge registry
        run: python -m scripts.build_knowledge
      - name: Run P0-P3 deterministic acceptance
        run: python -m pytest -q --ignore=tests/test_qdrant_integration.py --ignore=tests/test_p3_integration.py
      - name: Enforce RAG evaluation floor
        run: python -m scripts.eval_rag --fail-on-threshold
      - name: Enforce agent routing floor
        run: python -m scripts.eval_agent --fail-on-threshold

  backend-integration:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SESSION_BACKEND: redis
      REDIS_URL: redis://localhost:6379/0
      PERSISTENCE_ENABLED: "true"
      DATABASE_URL: postgresql://guilin:guilin@localhost:5432/guilin_ai
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: guilin_ai
          POSTGRES_USER: guilin
          POSTGRES_PASSWORD: guilin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guilin -d guilin_ai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify Redis and PostgreSQL round-trip
        run: python -m pytest -q tests/test_p3_integration.py

  qdrant-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify Qdrant regression
        run: python -m pytest -q tests/test_qdrant_integration.py

  open-meteo-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Open-Meteo live smoke (non-blocking external dependency)
        continue-on-error: true
        run: python -m scripts.live_provider_smoke --open-meteo
