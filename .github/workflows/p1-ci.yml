name: P1 RAG CI

on:
  push:
    branches:
      - feat/p1-production-rag
  pull_request:
    branches:
      - feat/p0-ai-customer-service
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_MOCK_MODE: "true"
      RAG_ENABLED: "true"
      EMBEDDING_PROVIDER: "hash"
      RAG_VECTOR_BACKEND: "memory"
      RERANK_MODE: "local"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run P0 and P1 acceptance tests
        run: python -m pytest -q
