services:
  migrate:
    build: .
    container_name: guilin-tourism-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://guilin:guilin@postgres:5432/guilin_ai
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ai-api:
    build: .
    container_name: guilin-tourism-ai
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      PERSISTENCE_ENABLED: "true"
      DATABASE_AUTO_CREATE: "false"
      DATABASE_URL: postgresql://guilin:guilin@postgres:5432/guilin_ai
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: guilin-tourism-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: guilin-tourism-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: guilin-tourism-postgres
    environment:
      POSTGRES_DB: guilin_ai
      POSTGRES_USER: guilin
      POSTGRES_PASSWORD: guilin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guilin -d guilin_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
